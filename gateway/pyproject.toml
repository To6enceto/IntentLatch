[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentlatch"
version = "0.1.0"
description = "IntentLatch control gateway"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "PyJWT>=2.8",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
