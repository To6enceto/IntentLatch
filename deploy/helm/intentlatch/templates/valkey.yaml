{{- if .Values.valkey.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: intentlatch-data
spec:
  selector: {app.kubernetes.io/name: valkey}
  ports: [{name: valkey, port: 6379, targetPort: valkey}]
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: intentlatch-data
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: valkey}
  ports: [{name: valkey, port: 6379, targetPort: valkey}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: intentlatch-data
spec:
  serviceName: valkey-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: valkey}
  template:
    metadata:
      labels: {app.kubernetes.io/name: valkey}
    spec:
      automountServiceAccountToken: false
      affinity:
        {{- include "intentlatch.generalAffinity" . | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              printf 'bind 0.0.0.0\nappendonly yes\ndir /data\nmaxmemory {{ .Values.valkey.maxMemory }}\nmaxmemory-policy noeviction\nrequirepass %s\n' "$REDISCLI_AUTH" > /tmp/valkey.conf
              exec valkey-server /tmp/valkey.conf
          env:
            # Valkey 8.1.10 still uses this name; current 9.x docs differ.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: valkey-auth, key: password}
          ports: [{name: valkey, containerPort: 6379}]
          securityContext:
            {{- include "intentlatch.security" . | nindent 12 }}
          readinessProbe:
            exec:
              command: [/bin/sh, -ec, 'test "$(valkey-cli ping)" = PONG']
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: valkey}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {intentlatch.io/managed: "true"}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests: {storage: {{ .Values.valkey.storage }}}
{{- end }}
