{{- if .Values.ollama.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama
  namespace: upstreams
  labels: {intentlatch.io/managed: "true"}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests: {storage: {{ .Values.ollama.storage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: upstreams
spec:
  selector: {app.kubernetes.io/name: ollama}
  ports: [{name: http, port: 11434, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: upstreams
spec:
  replicas: 1
  # One RWO volume cannot be attached to a replacement on another node at once.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ollama}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ollama}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.ollama.dedicatedNode }}
      nodeSelector: {intentlatch.io/role: ollama}
      tolerations:
        - {key: intentlatch.io/role, operator: Equal, value: ollama, effect: NoSchedule}
      {{- end }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports: [{name: http, containerPort: 11434}]
          securityContext:
            {{- include "intentlatch.security" . | nindent 12 }}
          env:
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_KEEP_ALIVE, value: "-1"}
            - {name: OLLAMA_MAX_LOADED_MODELS, value: "2"}
            - {name: OLLAMA_NUM_PARALLEL, value: "1"}
            - {name: OLLAMA_CONTEXT_LENGTH, value: "4096"}
            - {name: OLLAMA_NO_CLOUD, value: "true"}
          readinessProbe:
            httpGet: {path: /api/version, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          startupProbe:
            httpGet: {path: /api/version, port: http}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /root/.ollama}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: ollama}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
{{- if .Values.ollama.pull.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull
  namespace: upstreams
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: ollama-pull}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      affinity:
        {{- include "intentlatch.generalAffinity" . | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pull
          image: {{ .Values.ollama.image }}
          command: [/bin/sh, -ec]
          args:
            - |
              for attempt in $(seq 1 120); do
                ollama list >/dev/null 2>&1 && break
                sleep 5
              done
              ollama list >/dev/null
              ollama pull qwen2.5:3b
              ollama pull llama3.2:1b
              ollama run qwen2.5:3b 'Reply with OK only.'
              ollama run llama3.2:1b 'Reply with OK only.'
              ollama ps
          env:
            - {name: OLLAMA_HOST, value: "http://ollama.upstreams.svc.cluster.local:11434"}
            - {name: HOME, value: /tmp}
            - {name: OLLAMA_NOHISTORY, value: "true"}
          securityContext:
            {{- include "intentlatch.security" . | nindent 12 }}
          resources:
            {{- toYaml .Values.ollama.pull.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
{{- end }}
{{- end }}
