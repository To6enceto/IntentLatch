{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intentlatch-console
  namespace: intentlatch-system
  labels:
    {{- include "intentlatch.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: intentlatch-console}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intentlatch-console
        {{- include "intentlatch.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      affinity:
        {{- include "intentlatch.generalAffinity" . | nindent 8 }}
      containers:
        - name: console
          image: "{{ .Values.console.image }}:{{ required "console.tag is required" .Values.console.tag }}"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            {{- include "intentlatch.security" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
          # nginx keeps its pid and temporary files here; the root filesystem stays read-only.
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: intentlatch-console
  namespace: intentlatch-system
  labels: {app.kubernetes.io/name: intentlatch-console}
spec:
  selector: {app.kubernetes.io/name: intentlatch-console}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}
