{{- if .Values.webui.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui
  namespace: agents
  labels: {intentlatch.io/managed: "true"}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests: {storage: {{ .Values.webui.storage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: agents
spec:
  selector: {app.kubernetes.io/name: open-webui}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: agents
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: open-webui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: open-webui}
    spec:
      automountServiceAccountToken: false
      affinity:
        {{- include "intentlatch.generalAffinity" . | nindent 8 }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: open-webui
          image: {{ .Values.webui.image }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: OPENAI_API_BASE_URL, value: "http://intentlatch-gateway.intentlatch-system.svc.cluster.local:8080/v1"}
            - {name: ENABLE_OPENAI_API, value: "true"}
            - {name: ENABLE_OLLAMA_API, value: "false"}
            - {name: ENABLE_PERSISTENT_CONFIG, value: "false"}
            - {name: ENABLE_DIRECT_CONNECTIONS, value: "false"}
            - {name: WEBUI_AUTH, value: "true"}
            - {name: ENABLE_LOGIN_FORM, value: "true"}
            - {name: ENABLE_SIGNUP, value: {{ .Values.webui.enableSignup | quote }}}
            - {name: DEFAULT_USER_ROLE, value: pending}
            - {name: AIOHTTP_CLIENT_TIMEOUT, value: "360"}
            - {name: AIOHTTP_CLIENT_STREAM_IDLE_TIMEOUT, value: "360"}
            # Avoid competing CPU inference from automatic chat tasks.
            - {name: ENABLE_TITLE_GENERATION, value: "false"}
            - {name: ENABLE_TAGS_GENERATION, value: "false"}
            - {name: ENABLE_FOLLOW_UP_GENERATION, value: "false"}
            - {name: ENABLE_MEMORIES, value: "false"}
            - {name: OFFLINE_MODE, value: "true"}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: RAG_EMBEDDING_MODEL_AUTO_UPDATE, value: "false"}
            - {name: WHISPER_MODEL_AUTO_UPDATE, value: "false"}
            - {name: SCARF_NO_ANALYTICS, value: "true"}
            - {name: DO_NOT_TRACK, value: "true"}
            - {name: ANONYMIZED_TELEMETRY, value: "false"}
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: webui-auth, key: WEBUI_SECRET_KEY}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: webui-employee, key: OPENAI_API_KEY}
          readinessProbe:
            httpGet: {path: /health, port: http}
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            failureThreshold: 90
          resources:
            {{- toYaml .Values.webui.resources | nindent 12 }}
          volumeMounts: [{name: data, mountPath: /app/backend/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: open-webui}
{{- end }}
