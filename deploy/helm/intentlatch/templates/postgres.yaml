{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: intentlatch-data
data:
  10-app.sql: |
    \getenv app_password INTENTLATCH_DB_PASSWORD
    CREATE ROLE intentlatch LOGIN PASSWORD :'app_password';
    CREATE DATABASE intentlatch OWNER intentlatch;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: intentlatch-data
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: intentlatch-data
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
# One instance and no backups, explicitly chosen for the event.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: intentlatch-data
spec:
  replicas: 1
  serviceName: postgres-headless
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      automountServiceAccountToken: false
      affinity:
        {{- include "intentlatch.generalAffinity" . | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            {{- include "intentlatch.security" . | nindent 12 }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: postgres-password}
            - name: INTENTLATCH_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: app-password}
          readinessProbe:
            exec: {command: [pg_isready, -h, "127.0.0.1", -U, intentlatch, -d, intentlatch]}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: postgres}
            periodSeconds: 10
          startupProbe:
            tcpSocket: {port: postgres}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: init
          configMap: {name: postgres-init}
        - name: run
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {intentlatch.io/managed: "true"}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
{{- end }}
