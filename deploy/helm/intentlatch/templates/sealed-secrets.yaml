{{- range $id, $secret := .Values.sealedSecrets }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secret.name }}
  namespace: {{ $secret.namespace }}
  labels:
    {{- include "intentlatch.labels" $ | nindent 4 }}
spec:
  encryptedData:
    {{- range $key, $ciphertext := $secret.encryptedData }}
    {{ $key }}: {{ required (printf "Missing ciphertext for %s/%s" $id $key) $ciphertext | quote }}
    {{- end }}
  template:
    metadata:
      name: {{ $secret.name }}
      namespace: {{ $secret.namespace }}
    type: {{ $secret.type | default "Opaque" }}
{{- end }}
