# The edge sends /admin, /console and the model APIs to the gateway; everything else lands here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Vite hashes these file names, so they never change.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Every other path is a client-side route of the single-page app.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
